id: sql-injection
name: SQL Injection
version: "1.0.0"
last_updated: "2026-01-08"
confidence: high
severity: high
description: Detects unsanitized user input in SQL queries
sinks:
  - execute
  - executemany
  - raw
sources:
  - request.args
  - request.form
  - request.json
  - request.data
  - request.GET
  - request.POST
  - input
sanitizers:
  - quote_identifier
  - escape_string
  - parameterize
